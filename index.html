  <style>
    /* =========================================================
       CUSTOM GAME DESIGN TOKENS & ANIMATIONS
       ========================================================= */
    :root {
      --font-display: 'Fredoka', 'Comic Sans MS', system-ui, sans-serif;
      --font-body: 'Nunito', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-body);
      background: linear-gradient(180deg, #E0F2FE 0%, #FEF9C3 48%, #FCE7F3 100%);
      min-height: 100vh;
      overflow-x: hidden;
      color: #1E293B;
      margin: 0;
    }

    h1, h2, h3, h4, .font-display {
      font-family: var(--font-display);
    }

    /* Animated Rainbow Background Arc */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(3deg); }
    }

    @keyframes pulseGentle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      70% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    @keyframes bounceSuccess {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-12px) scale(1.08); }
      70% { transform: translateY(-4px) scale(1.02); }
    }

    @keyframes scanLaser {
      0% { top: 8%; opacity: 0.9; }
      50% { top: 88%; opacity: 1; }
      100% { top: 8%; opacity: 0.9; }
    }

    @keyframes rainbowDraw {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes screenFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-float { animation: floatSlow 3.6s ease-in-out infinite; }
    .animate-float-rev { animation: floatReverse 4.2s ease-in-out infinite; }
    .animate-pulse-gentle { animation: pulseGentle 2.4s ease-in-out infinite; }
    .animate-pop { animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .animate-shake { animation: shakeWrong 0.45s ease-in-out; }
    .animate-bounce-success { animation: bounceSuccess 0.55s ease-in-out; }
    .animate-spin-slow { animation: spinSlow 24s linear infinite; }
    .screen-enter { animation: screenFadeIn 0.32s ease-out forwards; }

    .rainbow-arc {
      stroke-dasharray: 600;
      animation: rainbowDraw 1.8s ease-out forwards;
    }

    /* Tactile 3D Cartoon Game Buttons */
    .btn-game {
      font-family: var(--font-display);
      font-weight: 700;
      border-radius: 1.25rem;
      border-bottom-width: 5px;
      transition: transform 0.12s ease, filter 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-game:hover:not(:disabled) {
      filter: brightness(1.05);
      transform: translateY(-2px);
    }

    .btn-game:active:not(:disabled) {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    .btn-game:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* Game Card Polish */
    .game-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 3px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.09), 0 4px 10px -4px rgba(15, 23, 42, 0.05);
      border-radius: 1.75rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card-hover:hover {
      transform: translateY(-5px) scale(1.015);
      box-shadow: 0 18px 32px -6px rgba(15, 23, 42, 0.14);
    }

    /* Drag & Drop Specifics */
    .drag-chip {
      touch-action: none;
      user-select: none;
      cursor: grab;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .drag-chip:active {
      cursor: grabbing;
    }

    .drop-zone {
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .drop-zone.drop-active {
      transform: scale(1.05);
      box-shadow: 0 0 0 5px rgba(59, 130, 246, 0.45);
      border-color: #2563EB !important;
    }

    /* Colouring SVG Interactive Parts */
    .colourable-part {
      cursor: pointer;
      transition: fill 0.22s ease, filter 0.15s ease;
    }

    .colourable-part:hover {
      filter: brightness(0.95) drop-shadow(0 0 4px rgba(59, 130, 246, 0.5));
    }

    /* Camera Scanner Laser */
    .scanner-laser {
      position: absolute;
      left: 6%;
      right: 6%;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #22C55E, #FACC15, #22C55E, transparent);
      box-shadow: 0 0 12px #22C55E;
      animation: scanLaser 2.2s ease-in-out infinite;
    }

    /* Confetti Canvas Overlay */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    /* Custom Scrollbar for Modals */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: #94A3B8;
      border-radius: 999px;
    }

    /* Metallic Gold Swatch Effect */
    .gold-swatch {
      background: linear-gradient(135deg, #FEF08A 0%, #EAB308 45%, #B45309 100%);
    }

    /* Rainbow Text Gradient */
    .rainbow-title {
      background: linear-gradient(90deg, #EF4444, #F97316, #EAB308, #22C55E, #3B82F6, #9333EA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>

    /* =========================================================
       2. GLOBAL STATE & PERSISTENCE (localStorage)
       ========================================================= */
    const STORAGE_KEY = 'my_colours_adventure_state_v1';

    function createDefaultState() {
      return {
        playerName: '',
        soundEnabled: true,
        musicEnabled: false,
        favouriteColour: 'blue',
        score: 0,
        correctTotal: 0,
        wrongTotal: 0,
        scoredItems: {}, // Prevents duplicate scoring on same question/task
        learnedCards: [], // Colour IDs explored in Level 1
        levelProgress: {
          1: { completed: false, stars: 0, best: 0 },
          2: { completed: false, stars: 0, best: 0 },
          3: { completed: false, stars: 0, best: 0 },
          4: { completed: false, stars: 0, best: 0 },
          5: { completed: false, stars: 0, best: 0 },
          6: { completed: false, stars: 0, best: 0 },
          7: { completed: false, stars: 0, best: 0 },
          8: { completed: false, stars: 0, best: 0 }
        },
        scannedColours: [], // Unique colours detected in Level 6
        huntSuccessIds: [], // Unique colours found in Level 7
        quizResult: {
          taken: false,
          correct: 0,
          wrong: 0,
          total: 20,
          percentage: 0
        }
      };
    }

    let gameState = loadState();
    let currentScreen = 'welcome';
    let lastSpokenText = '';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createDefaultState();
        const parsed = JSON.parse(raw);
        const def = createDefaultState();
        return {
          ...def,
          ...parsed,
          levelProgress: { ...def.levelProgress, ...(parsed.levelProgress || {}) },
          quizResult: { ...def.quizResult, ...(parsed.quizResult || {}) },
          scoredItems: parsed.scoredItems || {},
          learnedCards: parsed.learnedCards || [],
          scannedColours: parsed.scannedColours || [],
          huntSuccessIds: parsed.huntSuccessIds || []
        };
      } catch (e) {
        return createDefaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
      } catch (e) {
        // Ignore storage quota errors in restricted frames
      }
      updateHud();
    }

    function getTotalStars() {
      return Object.values(gameState.levelProgress).reduce((sum, l) => sum + (l.stars || 0), 0);
    }

    function getCompletedLevelsCount() {
      return Object.values(gameState.levelProgress).filter(l => l.completed).length;
    }

    function getStarRank(stars) {
      if (stars >= 16) return { label: 'Colour Master', stars: 3, badge: '👑' };
      if (stars >= 8) return { label: 'Colour Explorer', stars: 2, badge: '🧭' };
      return { label: 'Beginner Explorer', stars: 1, badge: '🌱' };
    }

    /**
     * Awards points ONLY ONCE per unique itemKey to guarantee consistent scoring
     */
    function awardPointsOnce(itemKey, points = 10, countAsCorrect = true) {
      if (gameState.scoredItems[itemKey]) return false;
      gameState.scoredItems[itemKey] = points;
      gameState.score += points;
      if (countAsCorrect) gameState.correctTotal += 1;
      saveState();
      return true;
    }

    function recordWrongAttempt() {
      gameState.wrongTotal += 1;
      saveState();
    }

    /**
     * Updates level progress & triggers animated star reward popup if stars increased
     */
    function updateLevelProgress(levelNum, ratio, completed = false) {
      const lp = gameState.levelProgress[levelNum];
      const prevStars = lp.stars || 0;
      let newStars = prevStars;
      if (ratio >= 0.9 || completed) newStars = Math.max(prevStars, 3);
      else if (ratio >= 0.6) newStars = Math.max(prevStars, 2);
      else if (ratio >= 0.25) newStars = Math.max(prevStars, 1);

      lp.stars = newStars;
      lp.best = Math.max(lp.best || 0, Math.round(ratio * 100));
      if (completed) lp.completed = true;
      saveState();

      if (newStars > prevStars) {
        const titles = {
          1: 'Beginner Explorer! ⭐',
          2: 'Colour Explorer! ⭐⭐',
          3: 'Colour Master! ⭐⭐⭐'
        };
        showStarPopup(newStars, titles[newStars], `Level ${levelNum} star unlocked! Keep exploring!`);
      }
    }

    function updateHud() {
      const hud = document.getElementById('topHud');

      document.getElementById('hudStars').textContent = getTotalStars();

          ? 'bg-emerald-500 text-white border-emerald-700'

      }`;

    /* =========================================================
       3. AUDIO ENGINE: WEB AUDIO API (SFX + BGM) & WEB SPEECH API
       ========================================================= */
    let audioCtx = null;
    let bgmTimer = null;
    let bgmStep = 0;

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(freq, duration = 0.15, type = 'sine', volume = 0.16, delay = 0) {
      if (!gameState.soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.03);
      } catch (e) {}
    }

    function sfxClick() {
      playTone(540, 0.07, 'triangle', 0.12);
    }

    function sfxCorrect() {
      playTone(523.25, 0.14, 'triangle', 0.18, 0);
      playTone(659.25, 0.14, 'triangle', 0.18, 0.09);
      playTone(783.99, 0.24, 'triangle', 0.2, 0.18);
    }

    function sfxWrong() {
      playTone(290, 0.16, 'sawtooth', 0.1, 0);
      playTone(220, 0.24, 'sawtooth', 0.1, 0.13);
    }

    function sfxScan() {
      playTone(880, 0.08, 'sine', 0.12, 0);
      playTone(1174, 0.12, 'sine', 0.12, 0.08);
    }

    function sfxCelebration() {
      const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
      const delays = [0, 0.1, 0.2, 0.3, 0.45, 0.58];
      notes.forEach((n, i) => playTone(n, 0.22, 'triangle', 0.18, delays[i]));
    }

    // Gentle Cheerful Marimba-Style Background Music Loop
    const BGM_MELODY = [
      523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880.00, 698.46,
      523.25, 659.25, 783.99, 1046.5, 880.00, 783.99, 659.25, 587.33
    ];

    function startBgm() {
      if (bgmTimer) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      bgmTimer = setInterval(() => {
        if (!gameState.musicEnabled) return;
        const note = BGM_MELODY[bgmStep % BGM_MELODY.length];
        bgmStep++;
        try {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(note, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.045, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.36);
        } catch (e) {}
      }, 420);
    }

    function stopBgm() {
      if (bgmTimer) {
        clearInterval(bgmTimer);
        bgmTimer = null;
      }
    }

    function toggleSound() {
      gameState.soundEnabled = !gameState.soundEnabled;
      if (!gameState.soundEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      } else {
        sfxClick();
      }
      saveState();
      if (currentScreen === 'welcome') renderWelcome();
      showToast(gameState.soundEnabled ? '🔊 Sound & Voice ON!' : '🔇 Sound & Voice OFF', 'info');
    }

    function toggleMusic() {
      gameState.musicEnabled = !gameState.musicEnabled;
      if (gameState.musicEnabled) {
        getAudioCtx();
        startBgm();
        showToast('🎵 Background Music ON!', 'info');
      } else {
        stopBgm();
        showToast('🎵 Background Music OFF', 'info');
      }
      saveState();
      if (currentScreen === 'welcome') renderWelcome();
    }

    /**
     * Web Speech API Text-to-Speech helper with child-friendly pacing
     */
    function speakText(text, force = false) {
      lastSpokenText = text;
      if (!gameState.soundEnabled && !force) return;
      if (!('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = 0.88;
        utter.pitch = 1.08;
        const voices = window.speechSynthesis.getVoices();
        const preferred = voices.find(v => /en-US|en-GB/i.test(v.lang) && /Google|Samantha|Natural|Female/i.test(v.name))
          || voices.find(v => /^en/i.test(v.lang));
        if (preferred) utter.voice = preferred;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    function replayLastAudio() {
      if (lastSpokenText) speakText(lastSpokenText, true);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    /* =========================================================
       4. CONFETTI, TOASTS & MODALS (NO NATIVE ALERT/CONFIRM)
       ========================================================= */
    let confettiParticles = [];
    let confettiAnimId = null;

    function launchConfetti(count = 75) {
      const canvas = document.getElementById('confettiCanvas');
      if (!canvas) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ['#EF4444', '#F97316', '#FACC15', '#22C55E', '#3B82F6', '#9333EA', '#EC4899'];

      for (let i = 0; i < count; i++) {
        confettiParticles.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * 140,
          w: 7 + Math.random() * 7,
          h: 10 + Math.random() * 8,
          vx: (Math.random() - 0.5) * 5,
          vy: 2.8 + Math.random() * 4.5,
          rot: Math.random() * 360,
          vrot: (Math.random() - 0.5) * 10,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 160 + Math.random() * 60
        });
      }

      if (!confettiAnimId) animateConfetti();
    }

    function animateConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      confettiParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.06;
        p.rot += p.vrot;
        p.life -= 1;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 40));
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });

      confettiParticles = confettiParticles.filter(p => p.life > 0 && p.y < canvas.height + 40);

      if (confettiParticles.length > 0) {
        confettiAnimId = requestAnimationFrame(animateConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        confettiAnimId = null;
      }
    }

    window.addEventListener('resize', () => {
      const canvas = document.getElementById('confettiCanvas');
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    });

    /* =========================================================
       5. CENTRALIZED CAMERA ENGINE (REAL PIXEL RGB + HSV ANALYSIS)
       ========================================================= */
    const CameraEngine = {
      stream: null,
      facingMode: 'environment', // Prefer rear camera on mobile devices
      videoEl: null,
      canvasEl: document.createElement('canvas'),
      isRunning: false,

      /**
       * Safely stops all active media tracks (Strict privacy & cleanup)
       */
      stop() {
        if (this.stream) {
          this.stream.getTracks().forEach(track => {
            try { track.stop(); } catch (e) {}
          });
          this.stream = null;
        }
        if (this.videoEl) {
          this.videoEl.srcObject = null;
        }
        this.isRunning = false;
      },

      /**
       * Starts real device camera using MediaDevices API with full error diagnostics
       */
      async start(videoElement, preferredFacing = null) {
        this.stop();
        this.videoEl = videoElement;
        if (preferredFacing) this.facingMode = preferredFacing;

        // Check secure context (HTTPS or localhost)
        const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!window.isSecureContext && !isLocal) {
          return {
            ok: false,
            code: 'INSECURE_CONTEXT',
            title: 'HTTPS Required for Camera',
            message: 'Akses kamera memerlukan koneksi HTTPS atau localhost. Buka aplikasi ini melalui HTTPS atau server lokal (localhost).'
          };
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return {
            ok: false,
            code: 'UNSUPPORTED',
            title: 'Camera Not Supported',
            message: 'Browser ini belum mendukung akses kamera (MediaDevices API). Gunakan Google Chrome, Edge, atau Safari versi terbaru.'
          };
        }

        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: this.facingMode },
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        };

        try {
          this.stream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch (err) {
          // Fallback to any available video device if facingMode constraint fails
          if (err.name === 'OverconstrainedError') {
            try {
              this.stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            } catch (fallbackErr) {
              return this.formatCameraError(fallbackErr);
            }
          } else {
            return this.formatCameraError(err);
          }
        }

        try {
          videoElement.srcObject = this.stream;
          await videoElement.play();
          this.isRunning = true;
          return { ok: true };
        } catch (playErr) {
          this.stop();
          return this.formatCameraError(playErr);
        }
      },

      async switchCamera(videoElement) {
        this.facingMode = this.facingMode === 'environment' ? 'user' : 'environment';
        return await this.start(videoElement, this.facingMode);
      },

      formatCameraError(err) {
        const name = err?.name || 'Error';
        if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
          return {
            ok: false,
            code: name,
            title: 'Camera Permission Denied',
            message: 'Izin kamera ditolak. Klik ikon gembok/kamera di bilah alamat browser, pilih "Allow / Izinkan", lalu coba klik START CAMERA lagi.'
          };
        }
        if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
          return {
            ok: false,
            code: name,
            title: 'No Camera Found',
            message: 'Kamera tidak ditemukan pada perangkat ini. Pastikan webcam terpasang atau gunakan perangkat berkamera.'
          };
        }
        if (name === 'NotReadableError' || name === 'TrackStartError') {
          return {
            ok: false,
            code: name,
            title: 'Camera Busy',
            message: 'Kamera sedang digunakan oleh aplikasi lain (misalnya Zoom, Meet, atau aplikasi Kamera). Tutup aplikasi tersebut lalu coba lagi.'
          };
        }
        return {
          ok: false,
          code: name,
          title: 'Cannot Access Camera',
          message: `Terjadi kendala saat membuka kamera (${name}). Pastikan izin kamera aktif dan perangkat memiliki kamera.`
        };
      },

      /**
       * Converts RGB (0-255) to HSV (H: 0-360, S: 0-100, V: 0-100)
       */
      rgbToHsv(r, g, b) {
        const rn = r / 255;
        const gn = g / 255;
        const bn = b / 255;
        const max = Math.max(rn, gn, bn);
        const min = Math.min(rn, gn, bn);
        const d = max - min;

        let h = 0;
        if (d !== 0) {
          if (max === rn) h = ((gn - bn) / d) % 6;
          else if (max === gn) h = (bn - rn) / d + 2;
          else h = (rn - gn) / d + 4;
          h = Math.round(h * 60);
          if (h < 0) h += 360;
        }
        const s = max === 0 ? 0 : (d / max) * 100;
        const v = max * 100;
        return { h, s, v };
      },

      /**
       * Classifies a single RGB/HSV reading into one of the 12 curriculum colours.
       * Tuned for real-world classroom lighting (shadows, matte paper, glossy plastic).
       */
      classifyPixel(r, g, b) {
        const { h, s, v } = this.rgbToHsv(r, g, b);

        // 1. Achromatic & Near-Achromatic (Black, White, Grey)
        if (v <= 17 || (v <= 24 && s <= 28)) {
          return 'black';
        }
        if (s <= 14 && v >= 72) {
          return 'white';
        }
        if (s <= 17 && v > 17 && v < 72) {
          return 'grey';
        }
        // Slightly tinted very dark neutrals
        if (v <= 26 && s <= 35 && !(h >= 12 && h <= 45)) {
          return 'black';
        }

        // 2. Warm Spectrum: Red, Pink, Orange, Brown, Gold, Yellow
        // Pink (Light red / magenta-pink)
        if ((h >= 305 && h <= 354) && v >= 48 && s >= 15 && s <= 75) {
          return 'pink';
        }
        if ((h >= 328 || h <= 8) && v >= 68 && s >= 14 && s <= 52) {
          return 'pink';
        }

        // Red
        if (h <= 12 || h >= 342) {
          // Very dark brownish-red
          if (v < 34 && h >= 4 && h <= 14 && s >= 25) return 'brown';
          return 'red';
        }

        // Brown (Low-to-mid brightness warm orange/amber)
        if (h > 12 && h <= 43 && v >= 16 && v <= 53 && s >= 20) {
          return 'brown';
        }

        // Orange
        if (h > 12 && h <= 36 && v > 53) {
          return 'orange';
        }

        // Gold vs Yellow (Gold is warmer amber-ochre 36-50 with medium-high value, Yellow is brighter 48-70)
        if (h > 36 && h <= 50) {
          if (v < 52) return 'brown';
          if (v <= 84 && s >= 32) return 'gold';
          return 'yellow';
        }

        // Yellow
        if (h > 50 && h <= 72) {
          if (v < 50 && s < 65) return 'brown';
          if (h <= 55 && v >= 52 && v <= 74 && s >= 45) return 'gold';
          return 'yellow';
        }

        // 3. Cool Spectrum: Green, Blue, Purple
        if (h > 72 && h <= 168) {
          return 'green';
        }
        if (h > 168 && h <= 256) {
          return 'blue';
        }
        if (h > 256 && h <= 325) {
          // Bright light magenta -> pink, deeper violet -> purple
          if (h >= 298 && v >= 68 && s <= 62) return 'pink';
          return 'purple';
        }

        return 'pink';
      },

      /**
       * Samples a grid of pixels from the center scanning box of the live video feed.
       * Uses median RGB + per-pixel voting + lighting diagnostics for high stability.
       */
      analyzeCenterBox(videoElement) {
        if (!videoElement || !this.isRunning || videoElement.videoWidth === 0 || videoElement.videoHeight === 0) {
          return { ok: false, reason: 'Camera feed is not ready yet. Please wait a moment.' };
        }

        const vw = videoElement.videoWidth;
        const vh = videoElement.videoHeight;
        const canvas = this.canvasEl;
        canvas.width = vw;
        canvas.height = vh;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(videoElement, 0, 0, vw, vh);

        // Central scanning box corresponds to center 26% width x 26% height
        const boxW = Math.max(24, Math.floor(vw * 0.26));
        const boxH = Math.max(24, Math.floor(vh * 0.26));
        const startX = Math.floor((vw - boxW) / 2);
        const startY = Math.floor((vh - boxH) / 2);

        const imgData = ctx.getImageData(startX, startY, boxW, boxH).data;

        const rVals = [];
        const gVals = [];
        const bVals = [];
        const voteCounts = {};
        let overexposedCount = 0;
        let pitchDarkCount = 0;

        // Sample an evenly spaced 16x16 grid (256 samples)
        const steps = 16;
        const totalSamples = steps * steps;

        for (let gy = 0; gy < steps; gy++) {
          for (let gx = 0; gx < steps; gx++) {
            const px = Math.floor(((gx + 0.5) / steps) * boxW);
            const py = Math.floor(((gy + 0.5) / steps) * boxH);
            const idx = (py * boxW + px) * 4;
            const r = imgData[idx];
            const g = imgData[idx + 1];
            const b = imgData[idx + 2];

            rVals.push(r);
            gVals.push(g);
            bVals.push(b);

            if (r > 250 && g > 250 && b > 250) overexposedCount++;
            if (r < 8 && g < 8 && b < 8) pitchDarkCount++;

            const label = this.classifyPixel(r, g, b);
            voteCounts[label] = (voteCounts[label] || 0) + 1;
          }
        }

        // Compute Median RGB (resistant to specular glare and noise)
        const median = (arr) => {
          const sorted = [...arr].sort((a, b) => a - b);
          const mid = Math.floor(sorted.length / 2);
          return sorted.length % 2 !== 0 ? sorted[mid] : Math.round((sorted[mid - 1] + sorted[mid]) / 2);
        };

        const medR = median(rVals);
        const medG = median(gVals);
        const medB = median(bVals);

        // Compute Colour Uniformity (Standard Deviation across RGB)
        const meanR = rVals.reduce((a, b) => a + b, 0) / totalSamples;
        const meanG = gVals.reduce((a, b) => a + b, 0) / totalSamples;
        const meanB = bVals.reduce((a, b) => a + b, 0) / totalSamples;
        const variance = rVals.reduce((acc, _, i) => {
          const dr = rVals[i] - meanR;
          const dg = gVals[i] - meanG;
          const db = bVals[i] - meanB;
          return acc + (dr * dr + dg * dg + db * db) / 3;
        }, 0) / totalSamples;
        const stdDev = Math.sqrt(variance);

        // Sort colour votes
        const sortedVotes = Object.entries(voteCounts).sort((a, b) => b[1] - a[1]);
        const [topColour, topVotes] = sortedVotes[0];
        const secondColour = sortedVotes[1] ? sortedVotes[1][0] : null;
        const secondVotes = sortedVotes[1] ? sortedVotes[1][1] : 0;

        const medianClass = this.classifyPixel(medR, medG, medB);
        const finalColour = (topVotes / totalSamples >= 0.42) ? topColour : medianClass;
        const agreementRatio = (voteCounts[finalColour] || 0) / totalSamples;

        // Lighting warning checks
        let lightingNote = '';
        if (pitchDarkCount / totalSamples > 0.92) {
          return {
            ok: false,
            uncertain: true,
            rgb: { r: medR, g: medG, b: medB },
            message: 'Please try another object! (Too dark – add more light / cahaya terlalu gelap)'
          };
        }
        if (overexposedCount / totalSamples > 0.92) {
          lightingNote = 'Very bright light detected (cahaya sangat terang).';
        } else if (stdDev > 62) {
          lightingNote = 'Mixed colours or reflection detected (warna tidak merata / pantulan).';
        }

        // Well-defined measurable confidence score:
        // 70% pixel agreement within scanning box + 30% colour uniformity score
        const uniformityScore = Math.max(0, Math.min(1, 1 - (stdDev / 95)));
        const confidence = Math.round((agreementRatio * 0.7 + uniformityScore * 0.3) * 100);

        if (confidence < 42 || agreementRatio < 0.35) {
          return {
            ok: false,
            uncertain: true,
            rgb: { r: medR, g: medG, b: medB },
            confidence,
            message: 'Please try another object! Hold one solid-coloured object closer inside the box.'
          };
        }

        const hsv = this.rgbToHsv(medR, medG, medB);
        return {
          ok: true,
          colourId: finalColour,
          runnerUp: secondVotes / totalSamples >= 0.22 ? secondColour : null,
          rgb: { r: medR, g: medG, b: medB },
          hsv,
          confidence,
          lightingNote
        };
      },

      /**
       * Checks if a scan result matches a target colour in Colour Hunt Challenge
       * with sensible tolerance for closely adjacent lighting conditions (e.g. gold/yellow)
       */
      matchesTarget(result, targetId) {
        if (!result || !result.ok) return false;
        if (result.colourId === targetId) return true;
        if (result.runnerUp === targetId && result.confidence >= 45) return true;

        // Slight lighting tolerance for metallic Gold vs Yellow/Orange-Brown
        if (targetId === 'gold' && (result.colourId === 'yellow' || result.colourId === 'brown') && result.hsv.h >= 34 && result.hsv.h <= 56) {
          return true;
        }
        // Slight tolerance for dark Grey vs Black under shadows
        if (targetId === 'grey' && result.colourId === 'black' && result.hsv.v >= 14 && result.hsv.s <= 22) {
          return true;
        }
        return false;
      }
    };

        menu: renderMainMenu,
        level1: renderLevel1Learn,
        level2: renderLevel2Guess,
        level3: renderLevel3Match,
        level4: renderLevel4Colouring,
        level5: renderLevel5Speak,
        level6: renderLevel6Scanner,
        level7: renderLevel7Hunt,
        level8: renderLevel8Quiz,
        results: renderFinalResults
      };

      const renderer = routes[screen] || renderMainMenu;
      renderer();
    }

      const q = GUESS_QUESTIONS[guessIndex];

        guessSolvedInSession.add(q.id);
        const gained = awardPointsOnce(`guess_${q.id}`, 10, true);
        sfxCorrect();
        launchConfetti(35);
        speakText(`${praise} It is ${COLOUR_MAP[q.answer].display}!`);
        guessFeedback = {
          type: 'correct',
          text: `🌟 ${praise} It is ${COLOUR_MAP[q.answer].name}! ${gained ? '(+10 Points)' : '(Reviewed!)'}`
        };
        updateLevelProgress(2, guessSolvedInSession.size / GUESS_QUESTIONS.length, guessSolvedInSession.size === GUESS_QUESTIONS.length);
        renderLevel2Guess();
      } else {
        recordWrongAttempt();
        sfxWrong();
        speakText('Try again!');
        guessFeedback = { type: 'wrong', text: '💡 Try Again! Look closely at the picture.' };
        renderLevel2Guess();
        const wrongBtn = document.getElementById(`guessOpt_${selectedId}`);

    function attemptMatchPair(wordId, targetId) {
      if (wordId === targetId) {
        matchedPairs.add(wordId);
        selectedWordForTap = null;
        const gained = awardPointsOnce(`match_${wordId}`, 10, true);
        sfxCorrect();
        speakText(`Great! ${COLOUR_MAP[wordId].display}!`);
        showToast(`✅ Correct! ${COLOUR_MAP[wordId].name}! ${gained ? '+10 pts' : ''}`, 'success');
        if (matchedPairs.size === 12) launchConfetti(70);
        updateLevelProgress(3, matchedPairs.size / 12, matchedPairs.size === 12);
        renderLevel3Match();
      } else {
        recordWrongAttempt();
        sfxWrong();
        speakText('Try again!');
        showToast('❌ Oops! That colour does not match. Try again!', 'error');
        const zone = document.querySelector(`[data-drop-colour="${targetId}"]`);
        if (zone) {

          setTimeout(() => zone.classList.remove('animate-shake'), 500);
        }
      }
    }

    /**
     * Unified Mouse + Touch Pointer Drag & Drop Engine
     */
    function attachPointerDragHandlers() {
      const chips = document.querySelectorAll('[data-drag-word]');
      chips.forEach(chip => {
        chip.addEventListener('pointerdown', (e) => {
          const wordId = chip.getAttribute('data-drag-word');
          if (!wordId || matchedPairs.has(wordId)) return;

          const startX = e.clientX;
          const startY = e.clientY;
          let isDragging = false;
          let ghost = null;

          const onMove = (ev) => {
            const dx = ev.clientX - startX;
            const dy = ev.clientY - startY;
            if (!isDragging && Math.hypot(dx, dy) > 8) {
              isDragging = true;
              ghost = chip.cloneNode(true);
              ghost.style.position = 'fixed';
              ghost.style.zIndex = '999';
              ghost.style.pointerEvents = 'none';
              ghost.style.width = `${chip.offsetWidth}px`;
              ghost.style.boxShadow = '0 16px 30px rgba(0,0,0,0.22)';
              ghost.style.transform = 'scale(1.08) rotate(-2deg)';
              ghost.classList.add('bg-sky-500', 'text-white', 'border-sky-700');
              document.body.appendChild(ghost);
              chip.style.opacity = '0.35';
            }

            if (isDragging && ghost) {
              ghost.style.left = `${ev.clientX - ghost.offsetWidth / 2}px`;
              ghost.style.top = `${ev.clientY - ghost.offsetHeight / 2}px`;

              document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drop-active'));
              const els = document.elementsFromPoint(ev.clientX, ev.clientY);
              const zone = els.find(el => el.hasAttribute && el.hasAttribute('data-drop-colour'));
              if (zone) zone.classList.add('drop-active');
            }
          };

          const onUp = (ev) => {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
            window.removeEventListener('pointercancel', onUp);
            document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drop-active'));

            if (ghost) {
              ghost.remove();
              ghost = null;
            }
            chip.style.opacity = '';

            if (isDragging) {
              const els = document.elementsFromPoint(ev.clientX, ev.clientY);
              const zone = els.find(el => el.hasAttribute && el.hasAttribute('data-drop-colour'));
              if (zone) {
                const targetId = zone.getAttribute('data-drop-colour');
                if (!matchedPairs.has(targetId)) {
                  attemptMatchPair(wordId, targetId);
                }
              }
            }
          };

          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
          window.addEventListener('pointercancel', onUp);
        });
      });
    }

    function startSpeechRecognition(targetColourId) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        showToast('Speech recognition is not supported in this browser.', 'warning');
        return;
      }

      try {
        if (activeRecognition) activeRecognition.abort();
        const rec = new SpeechRec();
        activeRecognition = rec;
        rec.lang = 'en-US';
        rec.interimResults = false;
        rec.maxAlternatives = 3;

        speechListening = true;
        speechTranscript = '';
        renderLevel5Speak();

        rec.onresult = (event) => {
          speechListening = false;
          const transcripts = Array.from(event.results[0]).map(r => r.transcript.toLowerCase().trim());
          speechTranscript = transcripts[0] || '';
          const targetWord = COLOUR_MAP[targetColourId].display.toLowerCase();

          // Check if any recognized alternative contains the spoken colour word
          const matched = transcripts.some(t => t.includes(targetWord) || (targetWord === 'grey' && t.includes('gray')));
          if (matched) {
            sfxCorrect();
            launchConfetti(35);
            speakText(`Wonderful! You said: It is ${targetWord}!`);
            showToast(`🌟 Awesome! We heard "${targetWord}"!`, 'success');
            awardPointsOnce(`speak_voice_${targetColourId}`, 5, false);
            speakSolved.add(targetColourId);
            speakStep = 'done';
            updateLevelProgress(5, speakSolved.size / SPEAK_ROUNDS.length, speakSolved.size === SPEAK_ROUNDS.length);
          } else {
            sfxWrong();
            showToast(`🎙️ Heard "${speechTranscript}". Try saying "It is ${targetWord}" clearly!`, 'warning');
          }
          renderLevel5Speak();
        };

        rec.onerror = (ev) => {
          speechListening = false;
          showToast(`Microphone note (${ev.error}). You can try again or use Manual Practice!`, 'warning');
          renderLevel5Speak();
        };

        rec.onend = () => {
          if (speechListening) {
            speechListening = false;
            renderLevel5Speak();
          }
        };

        rec.start();
      } catch (e) {
        speechListening = false;
        showToast('Could not start microphone. Please use Manual Practice mode.', 'warning');
        renderLevel5Speak();
      }
    }

      showHuntCameraActiveUI();

          gameState.huntSuccessIds.push(target.id);

        sfxCelebration();
        launchConfetti(60);
        speakText(`Amazing! You found ${target.display}!`);

    let activeQuiz = [];
    let quizIdx = 0;
    let quizCorrect = 0;
    let quizWrong = 0;

    function startNewQuizSession() {
      activeQuiz = shuffleArray(QUIZ_BANK).map(q => ({
        ...q,
        shuffledOptions: shuffleArray([...q.options])
      }));
      quizIdx = 0;
      quizCorrect = 0;
      quizWrong = 0;
      quizAnsweredCurrent = false;
      quizSelectedOpt = null;
    }

    function renderLevel8Quiz() {
      if (activeQuiz.length === 0) startNewQuizSession();
      const root = document.getElementById('appRoot');
      const total = activeQuiz.length;

      if (quizIdx >= total) {
        const pct = Math.round((quizCorrect / total) * 100);
        gameState.quizResult = {
          taken: true,
          correct: quizCorrect,
          wrong: quizWrong,
          total,
          percentage: pct
        };
        updateLevelProgress(8, pct / 100, true);
        saveState();
        sfxCelebration();
        launchConfetti(90);
        navigateTo('results');
        return;
      }

      const q = activeQuiz[quizIdx];
      const progressPct = Math.round((quizIdx / total) * 100);

                if (quizAnsweredCurrent) {
                  if (opt === q.answer) btnStyle = 'bg-emerald-500 text-white border-emerald-700 ring-4 ring-emerald-200';

                  else btnStyle = 'bg-slate-100 text-slate-400 border-slate-200';
                }
                return `
                  <button
                    onclick="submitQuizOption(${idx})"
                    ${quizAnsweredCurrent ? 'disabled' : ''}
                    class="btn-game py-3.5 px-4 text-left justify-start text-base sm:text-lg border-3 ${btnStyle}"

      if (quizAnsweredCurrent) return;
      const q = activeQuiz[quizIdx];
      const chosen = q.shuffledOptions[optIdx];
      quizSelectedOpt = chosen;
      quizAnsweredCurrent = true;

      if (chosen === q.answer) {
        quizCorrect++;
        awardPointsOnce(`quiz_${q.id}`, 10, true);
        sfxCorrect();
        speakText('Excellent!');
      } else {
        quizWrong++;

        sfxWrong();
        speakText(`The answer is ${q.answer}`);

      renderLevel8Quiz();

    /* =========================================================

              <button onclick="downloadResultsCSV()" class="btn-game bg-emerald-500 text-white border-emerald-700 px-5 py-2.5 text-sm">

              <button onclick="confirmResetAllProgress()" class="btn-game bg-rose-500 text-white border-rose-700 px-4 py-2.5 text-sm">

            <div class="font-display font-bold text-sky-800 text-base">Bahasa Inggris SD Kelas 3 • Fase B • Materi: My Colours (30–45 Menit)</div>

            </div>
            <div class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200">
              <strong>3. Ketergantungan Internet:</strong> Game berjalan mandiri dalam 1 file HTML. Koneksi internet hanya digunakan untuk memuat font & Tailwind CSS CDN; seluruh logika game, suara efek, dan deteksi kamera berjalan lokal di perangkat.

      openModal(`
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl sm:text-2xl font-bold text-slate-800">👩‍🏫 Mode Guru (Teacher Panel)</h2>
          <button onclick="closeModal()" class="btn-game bg-rose-500 text-white border-rose-700 px-3 py-1 text-sm">✖</button>

        <div class="flex flex-wrap gap-2 mb-4 pb-3 border-b-2 border-slate-100">

      `);
    }

    function downloadResultsCSV() {
      const name = (gameState.playerName.trim() || 'Explorer').replace(/,/g, ' ');
      const pct = gameState.quizResult.taken ? gameState.quizResult.percentage : 0;
      const cat = gameState.quizResult.taken ? getEvaluationCategory(pct).label : 'NOT TAKEN';
      const rows = [
        ['Field', 'Value'],
        ['Created By', 'A. SUSILAWATI - SMAN 10 PINRANG'],
        ['Student Name', name],
        ['Total Score', gameState.score],
        ['Total Stars', `${getTotalStars()} / 24`],
        ['Correct Answers', gameState.correctTotal],
        ['Wrong Attempts', gameState.wrongTotal],
        ['Levels Completed', `${getCompletedLevelsCount()} / 8`],
        ['Camera Colours Discovered', `${gameState.scannedColours.length} / 12`],
        ['Camera Hunt Succeeded', `${gameState.huntSuccessIds.length} / 12`],
        ['Final Quiz Score (%)', `${pct}%`],
        ['Final Quiz Category', cat],
        ['', ''],
        ['Level', 'Completed', 'Best Progress (%)', 'Stars']
      ];

      LEVELS_META.forEach(lv => {
        const lp = gameState.levelProgress[lv.num];
        rows.push([lv.title, lp.completed ? 'Yes' : 'No', `${lp.best || 0}%`, lp.stars || 0]);
      });

      const csvContent = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `MyColoursAdventure_Result_${name.replace(/\s+/g, '_')}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('📥 CSV Result downloaded!', 'success');
    }

    function confirmResetAllProgress() {
      openModal(`
        <div class="text-center">
          <div class="text-5xl mb-3">⚠️</div>
          <h3 class="text-2xl font-bold text-rose-600 mb-2">Reset All Progress?</h3>
          <p class="text-slate-600 font-semibold mb-5">Semua skor, bintang, dan progres level di perangkat ini akan dimulai dari awal.</p>
          <div class="flex justify-center gap-3">
            <button onclick="openTeacherModal('report')" class="btn-game bg-slate-200 text-slate-700 border-slate-400 px-5 py-2.5">Batal</button>
            <button onclick="executeResetAllProgress()" class="btn-game bg-rose-500 text-white border-rose-700 px-6 py-2.5">Ya, Reset Semua</button>
          </div>
        </div>
      `);
    }

    function executeResetAllProgress() {
      CameraEngine.stop();
      stopBgm();
      gameState = createDefaultState();
      guessIndex = 0;
      guessSolvedInSession = new Set();
      matchedPairs = new Set();
      completedColourTasks = new Set();
      speakIdx = 0;
      speakSolved = new Set();
      huntQueue = [];
      activeQuiz = [];
      saveState();
      closeModal();
      showToast('🔄 Progress berhasil direset!', 'info');
      navigateTo('welcome');
    }

    /* =========================================================
       19. UTILITY HELPERS & INITIALIZATION
       ========================================================= */
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Stop camera cleanly if tab is closed or hidden
    window.addEventListener('beforeunload', () => CameraEngine.stop());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && CameraEngine.isRunning) {
        CameraEngine.stop();
      }
    });

    // Boot Application
    window.addEventListener('DOMContentLoaded', () => {
      updateHud();
      renderWelcome();
    });
  </script>
